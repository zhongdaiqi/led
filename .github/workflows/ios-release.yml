name: iOS Release (TestFlight)

# ---------------------------------------------------------------------------
# 目的：在没有 Mac 电脑的前提下，把「电子灯牌」签名后自动上传到 TestFlight。
#
# 密钥全部来自仓库 Secrets（本机与仓库里都不存放任何证书文件）：
#   APP_STORE_CONNECT_ISSUER_ID   App Store Connect API Key 的 Issuer ID（UUID）
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API Key 的 Key ID（10 位）
#   APP_STORE_CONNECT_API_KEY     .p8 私钥的全文（含 BEGIN/END 两行）
#   APPLE_TEAM_ID                 Apple Developer 的 Team ID（10 位）
#
# 签名方式：自动签名 + -allowProvisioningUpdates，由 runner 现场向苹果
# 申请证书与描述文件，用完即弃。所以不需要导出 .p12 / .mobileprovision。
#
# 触发方式：
#   - 手动（Actions -> iOS Release (TestFlight) -> Run workflow）
#   - 打 tag（v1.0.0 这种）时自动跑
# 刻意不挂 push 到 main：macOS runner 计费是 Linux 的 10 倍，日常提交走
# ios.yml 的未签名构建就够了。
#
# 前置条件（需在 Apple Developer / App Store Connect 后台手动完成，CI 做不到）：
#   1. 在 developer.apple.com 注册 App ID = com.zuime.led。
#   2. 在 App Store Connect 创建该 App 记录（同名 bundle id）。
#   3. 生成 App Store Connect API Key（.p8），并把 Key ID / Issuer ID / .p8
#      分别填进仓库 Secrets（APP_STORE_CONNECT_KEY_ID / ISSUER_ID / API_KEY）。
#   4. App Store Connect 里填好隐私政策 URL
#      （https://led.zuime.com/privacy.html）与隐私营养标签问卷。
#
# SDK 版本要求（ITMS-90725）：
#   Apple 要求自 2027-04 起，上传的 build 必须用 iOS 27 SDK（Xcode 27+）构建。
#   当前 macos-latest 预装最高 Xcode 26.6 / iOS 26.5 SDK，Xcode 27 尚未进 runner，
#   因此现在无法升级，只会收到警告（不影响当前上架）。下方「SDK 版本门槛检查」
#   会在 2027-04 之后自动拦截旧 SDK 构建，届时需确保 runner 已提供 Xcode 27。
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 必须与项目实际使用的 Flutter 版本一致（本地 OHOS fork 基于 3.41.9），
  # 与 ios.yml 保持一致；用更高版本会导致签名产物与真实目标不一致。
  FLUTTER_VERSION: '3.41.9'

jobs:
  release-ios:
    name: 签名构建并上传 TestFlight
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 环境信息 + SDK 版本门槛检查
        run: |
          set -euo pipefail
          flutter --version
          echo "--- Xcode ---"
          xcodebuild -version

          # Apple ITMS-90725：2027-04 起上传的 build 必须用 iOS 27 SDK（Xcode 27+）。
          # 现在（Xcode 27 仍在 preview、runner 未预装）只提示不拦截；到期限后
          # 若仍是旧 SDK 则直接失败，避免上架当天才被发现。
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          echo "iOS SDK: $SDK_VERSION"
          if [ "$SDK_MAJOR" -lt 27 ]; then
            CUTOFF_TS="$(date -j -f '%Y-%m-%d' '2027-04-01' +%s)"
            NOW_TS="$(date +%s)"
            if [ "$NOW_TS" -ge "$CUTOFF_TS" ]; then
              echo "::error::Apple 要求自 2027-04 起用 iOS 27+ SDK 构建（当前 iOS $SDK_VERSION）。请在 runner 上切换到 Xcode 27 后重试。"
              exit 1
            fi
            echo "::warning::当前 iOS $SDK_VERSION SDK 低于 27；2027-04 起 Apple 将拒收，届时请升级 Xcode。"
          fi

      # 真实 Team ID 由 Secrets 提供；注入后 --no-codesign 预热构建才不会被
      # flutter 3.41 的 buildSettings 检查拦下。归档步骤还会再用 xcodebuild
      # 参数覆盖一次，这里只是让预热构建与真实签名目标一致。
      - name: 注入 DEVELOPMENT_TEAM
        env:
          DEVELOPMENT_TEAM_CI: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - "$DEVELOPMENT_TEAM_CI" <<'PY'
          import sys
          team = sys.argv[1]
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          s = open(p, encoding='utf-8').read()
          if 'DEVELOPMENT_TEAM' in s:
              print('DEVELOPMENT_TEAM already present, skipped')
          else:
              s = s.replace('buildSettings = {', 'buildSettings = {\n\t\t\t\tDEVELOPMENT_TEAM = "%s";' % team)
              open(p, 'w', encoding='utf-8').write(s)
              print('DEVELOPMENT_TEAM injected:', team)
          PY

      - name: 拉取依赖
        run: flutter pub get

      # ---------------------------------------------------------------------
      # App Store Connect API Key 落到 xcodebuild 认的目录。
      # 顺带做一次格式自检：手工粘贴 .p8 时最常见的错误就是漏了
      # BEGIN/END 两行或前后带到别的文本，这里直接给出明确报错。
      # ---------------------------------------------------------------------
      - name: 安装 App Store Connect API Key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"

          if ! head -1 "$KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::.p8 首行不是 -----BEGIN PRIVATE KEY-----，Secret APP_STORE_CONNECT_API_KEY 内容不完整"
            head -1 "$KEY"
            exit 1
          fi
          if ! tail -1 "$KEY" | grep -q 'END PRIVATE KEY'; then
            echo "::error::.p8 末行不是 -----END PRIVATE KEY-----，Secret APP_STORE_CONNECT_API_KEY 内容不完整"
            tail -1 "$KEY"
            exit 1
          fi
          echo "密钥就位：AuthKey_${ASC_KEY_ID}.p8（$(wc -c < "$KEY") 字节）"

      # 先用 --no-codesign 跑一遍：让 Flutter 生成 Generated.xcconfig 并执行
      # pod install，后面的 xcodebuild archive 才能直接用 workspace 归档。
      # --build-number 取 run number：App Store Connect 拒绝重复的构建号。
      - name: 构建 iOS（不签名，预热 Pods 与配置）
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      # ---------------------------------------------------------------------
      # ExportOptions.plist
      #   method       = app-store-connect（app-store 已被苹果废弃）
      #   destination  = upload —— 导出时直接上传 App Store Connect
      #   signingStyle = automatic —— 配合 -allowProvisioningUpdates 自动签
      # ---------------------------------------------------------------------
      - name: 生成 ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          echo "--- ExportOptions.plist ---"
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: 归档（archive）
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: 核对归档里的版本号
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP" || { echo "::error::归档里没有 Runner.app"; exit 1; }
          echo "=== 归档产物 Info.plist ==="
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            printf '%-30s = ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo "(无)"
          done

      # 导出 + 上传一步完成（destination=upload）
      - name: 导出并上传 TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # 注意：destination=upload 时 xcodebuild 是「边导出边上传」，本地不会
      # 留下 .ipa。需要留存 ipa 时把 ExportOptions.plist 的 destination 改成
      # export，再自行加一步 xcrun altool --upload-app 上传即可。

      # 用完就删：防止日志/缓存里残留
      - name: 清理密钥
        if: always()
        run: rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP/AuthKey.p8"
