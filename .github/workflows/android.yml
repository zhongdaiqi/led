name: Android Build

# ---------------------------------------------------------------------------
# 目的：用 GitHub Linux runner 验证 Android 包能编译（无需任何 Secret）。
# 与 ios.yml 对称：push main / PR / 手动触发。
#
# 关键适配（由 ci/transform_pubspec_android.py 完成）：
#   本项目的 shared_preferences 依赖 gitcode.com 的 OHOS fork（git 依赖），
#   GitHub runner 拉国内源极不稳定；脚本把它换成 pub.dev hosted 2.2.0 并删除
#   pubspec.lock，保证依赖能解析。
#
# 本工作流不配签名密钥，build.gradle.kts 会自动回退 debug 签名，仅证明编译
# 链路通，不能上架。签名发布见 android-release.yml。
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推多次时取消旧构建，省 Linux 分钟数
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地开发机（OHOS fork 3.41.9）及 iOS CI 保持一致
  FLUTTER_VERSION: '3.41.9'

jobs:
  build-android:
    name: 构建 Android（release 验证）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 3.41.9 的 flutter.ndkVersion = 28.2.13676358，runner 镜像只预装
      # 27.x/29.x/30.x，缺这个版本 AGP 解析 NDK 直接失败（strip 原生符号要用）。
      - name: 安装 NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 环境信息（排错用）
        run: flutter --version

      - name: CI 适配（git 依赖 → pub.dev hosted）
        run: python ci/transform_pubspec_android.py

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 release AAB（验证）
        run: flutter build appbundle --release

      - name: 构建 release APK（split-per-abi，验证）
        run: flutter build apk --release --split-per-abi

      - name: 核对产物信息
        run: |
          set -euo pipefail
          echo "=== 产物清单 ==="
          find build/app/outputs \( -name '*.aab' -o -name '*.apk' \) | sort
          echo
          echo "=== 体积 ==="
          find build/app/outputs \( -name '*.aab' -o -name '*.apk' \) -exec sh -c 'printf "%-8s %s\n" "$(du -h "$1" | cut -f1)" "$1"' _ {} \;

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
