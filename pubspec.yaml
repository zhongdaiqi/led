name: led
description: "电子灯牌 — 把手机屏幕变成 LED 灯牌，完全离线、无服务端。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # OHOS 适配版（同一份包也声明了 android / ios / web 等平台）。
  # 用 git 而不是 pub.dev 版本，是为了拿到 ohos 插件实现。
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
